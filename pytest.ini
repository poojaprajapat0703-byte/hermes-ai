[pytest]
asyncio_mode = auto
testpaths = services/api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[coverage:run]
omit =
    services/ingestion/*
    services/orchestrator/*

[coverage:report]
fail_under = 70
omit =
    services/ingestion/*
    services/orchestrator/*