# =============================================================================
# Hermes — Local Infrastructure
# =============================================================================
#
# CREDENTIAL CONTRACT:
#   All secrets live in .env (never hardcoded here).
#   This file reads them via ${VAR} substitution.
#   Run: docker compose down -v && docker compose up --build -d
#   The -v flag destroys the postgres volume so it re-reads POSTGRES_PASSWORD.
# =============================================================================

version: "3.9"

services:

  # ─── Message Queue ──────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hermes-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - hermes-network
    healthcheck:
      test: ["CMD", "bash", "-c", "zookeeper-shell localhost:2181 ls / > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hermes-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"       # host-facing port (for kafkacat, Kafka UI, etc.)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 60000
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 60000
      # Two listeners:
      #   PLAINTEXT     → used by containers inside the Docker network (kafka:9092)
      #   PLAINTEXT_HOST → used by tools on your host machine (localhost:29092)
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    networks:
      - hermes-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hermes-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hermes-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    networks:
      - hermes-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: hermes-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:9092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    networks:
      - hermes-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─── Database ───────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    env_file: .env                              # reads the full .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}           # sourced from .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # sourced from .env
      POSTGRES_DB: ${POSTGRES_DB}               # sourced from .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hermes-network
    healthcheck:
      # Uses ${VAR} here too — stays in sync automatically
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache ──────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hermes-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Vector Store (RAG) ─────────────────────────────────────────────────────

  qdrant:
    image: qdrant/qdrant
    container_name: hermes-qdrant
    ports:
      - "6333:6333"     # REST API + Web UI
      - "6334:6334"     # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - hermes-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API ────────────────────────────────────────────────────────────────────
  # Uncomment when services/api/Dockerfile exists (end of D5)
  #
  # api:
  #   build: ./services/api
  #   container_name: hermes-api
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  #     REDIS_URL: ${REDIS_URL}
  #     LOG_LEVEL: ${LOG_LEVEL}
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy   # waits for pg_isready
  #     kafka:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - hermes-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:          # ← NEW: persists vectors across restarts

networks:
  hermes-network:
    driver: bridge