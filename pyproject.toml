[project]
name = "hermes-ai"
version = "0.1.0"
description = "AI-native incident intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.10.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.5.1",
    "kafka-python>=2.3.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "prometheus-client>=0.25.0",
    "langfuse>=4.6.1",
    "pytest-asyncio>=1.3.0",
]

[dependency-groups]
dev = [
    "langgraph-cli>=0.4.26",
    "mypy>=1.11.0",
    "pre-commit>=4.6.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "types-redis>=4.6.0.20241004",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "types-redis>=4.6.0.20241004",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["services/api/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"
markers = [
    "integration: marks tests as integration tests (real LLM calls)",
]

[tool.coverage.run]
source = ["services"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "services/ingestion/*",
    "services/orchestrator/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "services/ingestion/*",
    "services/orchestrator/*",
]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false   
warn_return_any = false
explicit_package_bases = true

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "shared*"]