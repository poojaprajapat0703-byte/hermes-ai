[project]
name = "hermes-ai"
version = "0.1.0"
description = "AI-native incident intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.10.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "redis>=5.0.4",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pre-commit>=4.6.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["services/api/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"
markers = [
    "integration: marks tests as integration tests (real LLM calls)",
]

[tool.coverage.run]
source = ["services"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "services/ingestion/*",
    "services/orchestrator/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "services/ingestion/*",
    "services/orchestrator/*",
]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false